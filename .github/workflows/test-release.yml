name: Publish test APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft prerelease tag
        required: true
        default: v0.3-dev
        type: string
      source_sha:
        description: Full tested commit SHA from main
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: test-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify release source and successful CI
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --commit "$SOURCE_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")')
          test "$passed" = true
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          test "$draft" = true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore persistent release keystore
        env:
          OFFGRID_KEYSTORE_BASE64: ${{ secrets.OFFGRID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get("OFFGRID_KEYSTORE_BASE64", "")
          if not encoded:
              raise SystemExit("Missing OFFGRID_KEYSTORE_BASE64 repository secret. See SIGNING.md.")
          path = Path(os.environ["RUNNER_TEMP"]) / "offgrid-release.p12"
          # Restrict permissions at creation, before any key bytes are written.
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as output:
              output.write(base64.b64decode(encoded, validate=True))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"OFFGRID_KEYSTORE_FILE={path}\n")
          PYTHON
      - name: Build signed release APK
        env:
          OFFGRID_STORE_PASSWORD: ${{ secrets.OFFGRID_STORE_PASSWORD }}
          OFFGRID_KEY_PASSWORD: ${{ secrets.OFFGRID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease
      - name: Verify and stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          apk="release-assets/OffGrid-${RELEASE_TAG}-test.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          python3 scripts/verify-release-apk.py "$apk" --version "${RELEASE_TAG#v}" --signature-output release-assets/APK-SIGNATURE.txt
          cp TESTING.md release-assets/TESTING.md
          cd release-assets
          sha256sum "OffGrid-${RELEASE_TAG}-test.apk" > SHA256SUMS.txt
      - name: Upload APK and publish prerelease
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --draft=false

      - name: Remove runner keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/offgrid-release.p12"
