name: Android build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, lint and unit tests
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Check app identity and fail-closed release signing
        shell: bash
        run: |
          set -euo pipefail
          test "$(apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk)" = io.github.mittalsukhansh.offgrid.debug
          test "$(apkanalyzer manifest debuggable app/build/outputs/apk/debug/app-debug.apk)" = true
          python3 - <<'PYTHON'
          import ast, hashlib, json, ssl, subprocess
          from pathlib import Path
          ast.parse(Path("scripts/verify-release-apk.py").read_text())
          identity = json.loads(Path("signing/release-identity.json").read_text())
          cert = ssl.PEM_cert_to_DER_cert(Path("signing/offgrid-release-cert.pem").read_text())
          assert hashlib.sha256(cert).hexdigest() == identity["certificateSha256"]
          result = subprocess.run(
              ["./gradlew", "--no-daemon", "--no-configuration-cache", "assembleRelease"],
              capture_output=True, text=True)
          assert result.returncode != 0, "Release built without signing secrets"
          assert "Release signing is required. Missing:" in result.stdout + result.stderr, result.stdout + result.stderr
          print("Debug package, public signing pin and missing-key rejection verified")
          PYTHON
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offgrid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android database and Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
