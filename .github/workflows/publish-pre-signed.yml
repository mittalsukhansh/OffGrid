name: Verify pre-signed candidate and optional experimental release
on:
  push:
    branches: ['release-assets/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-offgrid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == 'mittalsukhansh/OffGrid'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.artifacts.outputs.publish }}
      tag: ${{ steps.artifacts.outputs.tag }}
      source: ${{ steps.artifacts.outputs.source }}
      apk: ${{ steps.artifacts.outputs.apk }}
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - name: Install verifier tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify pinned certificate, package, hashes and signed provenance
        id: artifacts
        run: python3 scripts/verify-staged-release.py
      - name: Require successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=$(python3 -c 'import json; print(json.load(open("release-staging/manifest.json"))["sourceCommit"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE&per_page=100" > "$RUNNER_TEMP/source-ci.json"
          python3 - "$RUNNER_TEMP/source-ci.json" <<'PY'
          import json,sys
          runs=json.load(open(sys.argv[1]))['workflow_runs']
          assert any(r['name']=='Android build and checks' and r['conclusion']=='success' for r in runs), 'Exact source CI has not passed'
          PY
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test signed install without uninstalling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: bash scripts/check-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-upgrade-evidence
          path: |
            release-evidence/
            release-staging/SHA256SUMS
            release-staging/signature.txt
          if-no-files-found: ignore
      - name: Upload validated installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: signed-installable-candidate
          path: |
            release-staging/offgrid-*.apk
            release-staging/manifest.json
            release-staging/SHA256SUMS
            release-staging/signature.txt
            signing/offgrid-release-cert.pem
            release-evidence/
          if-no-files-found: error
  publish:
    needs: upgrade
    if: needs.upgrade.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-upgrade-evidence
          path: .
      - name: Publish explicitly requested experimental version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.upgrade.outputs.tag }}
          SOURCE_SHA: ${{ needs.upgrade.outputs.source }}
          RELEASE_APK: ${{ needs.upgrade.outputs.apk }}
          RELEASE_VERSION: ${{ needs.upgrade.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease --title "OffGrid $RELEASE_VERSION — experimental" --notes "Experimental build. No physical-radio results are implied. Signed in-place upgrade evidence is attached; see TESTING.md for the phone procedure." "release-staging/$RELEASE_APK" release-staging/SHA256SUMS release-staging/signature.txt signing/offgrid-release-cert.pem release-evidence/upgrade.txt
